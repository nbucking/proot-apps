name: Daily Package check
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read
jobs:
  meta:
    name: Ingest Metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-meta
        run: |
          curl -o yq -L "https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64"
          chmod +x yq
          {
            echo "matrix<<EOF"
            ./yq -o=j -I=0 '.' metadata/metadata.yml
            echo "EOF"
          } >> $GITHUB_OUTPUT
  pupdate:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash ci-scripts/update-packages.sh ${{ matrix.name }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          path: apps/${{ matrix.name }}/package_versions.txt
          retention-days: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
  pcommit:
    runs-on: ubuntu-latest
    if: success() || failure()
    needs: pupdate
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          if [ -d artifacts ] && [ "$(ls -A artifacts)" ]; then
            rsync -av artifacts/* apps/
          fi
      - run: |
          git config --global user.name 'Package Bot'
          git config --global user.email 'package-bot@users.noreply.github.com'
          git add apps/
          if ! git diff --quiet HEAD; then
            git commit -m "Bot Updating Package Versions"
            git push origin master
          fi
