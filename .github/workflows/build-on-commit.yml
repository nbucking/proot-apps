name: build-on-commit

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  base:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          cd base-images &&
          docker buildx build --push
          --file Dockerfile.${{ matrix.name }}
          --platform linux/amd64,linux/arm64
          --build-arg REPO=${GITHUB_REPOSITORY,,}
          --tag ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.name }} .
    strategy:
      matrix:
        include:
          - name: alpine-323
          - name: alpine-edge
          - name: debian-trixie
          - name: ubuntu-noble
  meta:
    name: Ingest Metadata
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-meta
        run: |
          curl -o yq -L "https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64"
          chmod +x yq
          {
            echo "matrix<<EOF"
            ./yq -o=j -I=0 '.' metadata/metadata.yml
            echo "EOF"
          } >> $GITHUB_OUTPUT
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - base
      - meta
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            folder:
              - "apps/${{ matrix.name }}/**"
      - if: steps.changes.outputs.folder == 'true'
        run: >
          cd apps/${{ matrix.name }}/ &&
          docker buildx build --push
          --platform ${{ matrix.arch }}
          --build-arg REPO=${GITHUB_REPOSITORY,,}
          --tag ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.name }} .
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
